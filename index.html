<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gym Planner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-bar">
        <button class="app-bar-back hidden" type="button" aria-label="返回">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="app-bar-mark" aria-hidden="true">GP</span>
        <div class="app-bar-text">
          <p class="app-bar-eyebrow">Gym Planner</p>
          <strong class="app-bar-title">訓練紀錄</strong>
        </div>
      </header>

      <main class="page-stack">
        <section id="page-home" class="page is-active">
          <div class="home-grid">
            <button class="home-card nav-btn" type="button" data-page="workout">
              <h2>開始訓練</h2>
            </button>
            <button class="home-card nav-btn" type="button" data-page="plan-create">
              <h2>新增課表</h2>
            </button>
            <button class="home-card nav-btn" type="button" data-page="plan-list">
              <h2>課表列表</h2>
            </button>
            <button class="home-card nav-btn" type="button" data-page="history">
              <h2>歷史紀錄</h2>
            </button>
            <button class="home-card nav-btn" type="button" data-page="sheets">
              <h2>Google Sheets</h2>
            </button>
          </div>
        </section>

        <section id="page-plan-create" class="page panel hidden">
          <input
            id="draft-plan-name"
            type="text"
            placeholder="課表名稱"
            aria-label="課表名稱"
            autocomplete="off"
            maxlength="40"
            class="title-input"
          />

          <div id="draft-exercise-list" class="nested-list"></div>

          <form id="draft-exercise-form" class="add-form">
            <input
              name="exerciseName"
              type="text"
              placeholder="新增動作"
              aria-label="新增動作"
              autocomplete="off"
              maxlength="40"
              required
            />
            <button class="add-btn" type="submit" aria-label="新增動作">+</button>
          </form>

          <button id="commit-plan-btn" class="primary-btn commit-btn" type="button">加入課表</button>
        </section>

        <section id="page-plan-list" class="page panel hidden">
          <div id="plan-list" class="stack-list"></div>
        </section>

        <section id="page-plan-detail" class="page panel hidden">
          <form id="detail-add-exercise-form" class="add-form">
            <input
              name="exerciseName"
              type="text"
              placeholder="新增動作"
              aria-label="新增動作"
              autocomplete="off"
              maxlength="40"
              required
            />
            <button class="add-btn" type="submit" aria-label="新增動作">+</button>
          </form>

          <div id="plan-detail-exercises" class="nested-list"></div>

          <div class="card-actions">
            <button id="delete-plan-btn" class="ghost-btn" type="button">刪除課表</button>
          </div>
        </section>

        <section id="page-workout" class="page panel hidden">
          <div id="workout-plan-picker" class="stack-list"></div>

          <div id="timer-card" class="timer-card hidden">
            <p class="timer-label">休息倒數</p>
            <strong id="timer-display">00:00</strong>
            <p id="timer-context" class="timer-context"></p>
            <button id="skip-rest-btn" class="secondary-btn timer-action" type="button">結束休息</button>
          </div>

          <div id="active-workout" class="stack-list"></div>
        </section>

        <section id="page-history" class="page panel hidden">
          <div id="history-list" class="stack-list"></div>
        </section>

        <section id="page-sheets" class="page panel hidden">
          <div class="sheets-block">
            <p class="card-meta">
              在 Google Sheets 用 <strong>檔案 → 分享 → 發布到網路</strong>，選擇對應分頁、格式為 CSV，把連結貼進來。
            </p>
            <input
              id="sheets-url"
              type="url"
              placeholder="https://docs.google.com/.../pub?output=csv"
              autocomplete="off"
              class="sheets-url-input"
            />
            <div class="sheets-actions">
              <button id="save-sheets-url-btn" type="button" class="secondary-btn">儲存網址</button>
              <button id="sync-sheets-btn" type="button" class="primary-btn">從 Sheets 同步</button>
            </div>
            <p id="sheets-status" class="sheets-status hidden"></p>
          </div>

          <div class="sheets-block">
            <p class="card-meta">給 AI 用的工具</p>
            <div class="sheets-actions">
              <button id="copy-sheets-prompt-btn" type="button" class="secondary-btn">複製『產生課表』提示詞</button>
              <button id="copy-analysis-btn" type="button" class="secondary-btn">複製課表+紀錄給 AI 分析</button>
            </div>
          </div>

          <details class="sheets-block">
            <summary class="import-summary">
              <span>欄位格式說明</span>
              <span class="import-summary-chevron" aria-hidden="true">›</span>
            </summary>
            <div class="sheets-help">
              <p class="card-meta">第一列為標頭，每一列代表一組。</p>
              <pre class="sheets-example">plan,exercise,weight,reps,rest
推日,Bench Press,60,10,90
推日,Bench Press,70,8,90
推日,Shoulder Press,30,12,60</pre>
            </div>
          </details>
        </section>
      </main>
    </div>

    <div id="completion-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="completion-title">
      <div class="modal-card">
        <p class="section-kicker">訓練完成</p>
        <h2 id="completion-title">恭喜完成</h2>
        <p id="completion-copy" class="modal-copy">這次課表已經收錄到歷史紀錄。</p>
        <button id="completion-home-btn" class="primary-btn" type="button">返回首頁</button>
      </div>
    </div>

    <template id="plan-summary-template">
      <div class="plan-summary">
        <button class="plan-summary-main" type="button">
          <div class="plan-summary-text">
            <strong class="plan-summary-name"></strong>
            <p class="card-meta plan-summary-meta"></p>
          </div>
          <span class="plan-summary-chevron" aria-hidden="true">›</span>
        </button>
        <button class="plan-summary-delete icon-btn" type="button" aria-label="刪除課表">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-8 0v12a2 2 0 002 2h6a2 2 0 002-2V7M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </template>

    <template id="exercise-editor-template">
      <section class="nested-card">
        <div class="card-topline">
          <button class="exercise-toggle-btn" type="button">
            <span class="exercise-toggle-chevron" aria-hidden="true">›</span>
            <div class="exercise-toggle-text">
              <strong class="exercise-name"></strong>
              <p class="card-meta exercise-meta"></p>
            </div>
          </button>
          <span class="drag-handle icon-btn" role="button" tabindex="-1" aria-label="拖曳排序">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </span>
          <button class="icon-btn remove-exercise-btn" type="button" aria-label="刪除動作">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-8 0v12a2 2 0 002 2h6a2 2 0 002-2V7M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="exercise-body">

        <form class="add-form set-form">
          <div class="set-fields">
            <input name="weight" type="number" placeholder="kg" aria-label="重量" min="0" step="0.5" inputmode="decimal" required />
            <span class="set-fields-sep">×</span>
            <input name="reps" type="number" placeholder="組" aria-label="次數" min="1" step="1" inputmode="numeric" required />
            <span class="set-fields-sep">休息</span>
            <input name="rest" type="number" placeholder="秒" aria-label="休息秒數" min="0" step="1" inputmode="numeric" required />
          </div>
          <button class="add-btn" type="submit" aria-label="加入組">+</button>
        </form>

        <div class="set-chip-list"></div>
        </div>
      </section>
    </template>

    <template id="workout-plan-template">
      <article class="plan-card">
        <div class="card-topline">
          <div>
            <strong class="card-title"></strong>
            <p class="card-meta"></p>
          </div>
          <button class="primary-btn start-plan-btn" type="button">開始訓練</button>
        </div>
      </article>
    </template>

    <template id="active-exercise-template">
      <article class="workout-card">
        <button class="exercise-toggle" type="button">
          <div>
            <strong class="workout-title"></strong>
            <p class="card-meta workout-meta"></p>
          </div>
          <span class="status-badge workout-badge"></span>
        </button>
        <div class="active-set-list hidden"></div>
      </article>
    </template>

    <template id="active-set-template">
      <div class="set-row">
        <div class="set-row-copy">
          <strong class="set-label"></strong>
          <p class="set-detail"></p>
        </div>
        <button class="primary-btn complete-set-btn" type="button">完成</button>
      </div>
    </template>

    <template id="history-card-template">
      <article class="history-card">
        <div class="card-topline">
          <div>
            <strong class="card-title"></strong>
            <p class="card-meta"></p>
          </div>
          <span class="status-badge is-complete">已完成</span>
        </div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
